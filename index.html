<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Félicitations !!!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        body {
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff6600, #ff00ff);
            background-size: 500% 500%;
            animation: rainbow 8s ease infinite;
            font-family: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
            text-align: center;
            padding: 15px;
            color: #00ff00;
            text-shadow: 2px 2px 3px #000000;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 95%;
            max-width: 400px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 4px dashed #ff00ff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.7);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.98); }
            to { transform: scale(1.02); }
        }

        h1 {
            font-size: 2.5em;
            margin: 15px 0;
            color: #ffff00;
            text-shadow: 3px 3px 0px #ff00ff;
            font-weight: bold;
            font-family: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
        }

        p {
            font-size: 1.4em;
            margin: 15px 0;
            border: 3px dotted #00ffff;
            padding: 12px;
            background-color: rgba(255, 0, 255, 0.2);
            border-radius: 10px;
            line-height: 1.4;
            font-family: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
        }

        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #f00;
            animation: confetti-fall linear infinite;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .emoji {
            font-size: 2.5em;
            margin: 10px;
            animation: bounce 1s infinite alternate;
            display: block;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="confetti" id="confetti"></div>
    <div class="container">
        <div class="emoji">🎉🏉🎊</div>
        <h1>FÉLICITATIONS !!!</h1>
        <div class="emoji">✨🎟️✨</div>
        <p>
            Vous avez gagné <strong>deux places</strong> pour le match<br>
            <strong>R92 vs RC Toulon</strong><br>
            <strong>24ème journée du Top 14</strong><br>
            le week-end du <strong>16 mai 2026</strong> !!!!
        </p>
        <div class="emoji">🎉🏆🎉</div>
    </div>

    <script>
        // Génération de confettis
        const confettiContainer = document.getElementById('confetti');
        const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff', '#ff9900', '#ff00ff'];

        for (let i = 0; i < 200; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-piece');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 4 + 3) + 's';
            confetti.style.animationDelay = (Math.random() * 3) + 's';
            confettiContainer.appendChild(confetti);
        }
    </script>
</body>
</html>
